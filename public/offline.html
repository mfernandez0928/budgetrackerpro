<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Budget Tracker Pro Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(20, 184, 166, 0.24), transparent 24rem),
          #020617;
        color: #f8fafc;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.82);
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #042f2e;
        background: #2dd4bf;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Budget Tracker Pro keeps your budgeting data on this device. Reopen the app once you are
        back online if the main app shell is not already cached.
      </p>
      <a href="/dashboard">Try the app again</a>
    </main>
  </body>
</html>
